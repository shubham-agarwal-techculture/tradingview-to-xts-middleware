<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TradingView Webhook Dashboard</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono&display=swap"
        rel="stylesheet">
    <style>
        :root {
            --bg-color: #0f172a;
            --card-bg: #1e293b;
            --accent-primary: #3b82f6;
            --accent-secondary: #8b5cf6;
            --text-primary: #f8fafc;
            --text-secondary: #94a3b8;
            --success: #22c55e;
            --danger: #ef4444;
            --border: #334155;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Inter', sans-serif;
            background-color: var(--bg-color);
            color: var(--text-primary);
            line-height: 1.5;
            padding: 2rem;
        }

        .container {
            max-width: 1400px;
            margin: 0 auto;
        }

        header {
            margin-bottom: 2rem;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        h1 {
            font-size: 1.875rem;
            font-weight: 700;
            background: linear-gradient(to right, var(--accent-primary), var(--accent-secondary));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .status-badge {
            background: rgba(34, 197, 94, 0.1);
            color: var(--success);
            padding: 0.5rem 1rem;
            border-radius: 9999px;
            font-size: 0.875rem;
            font-weight: 500;
            border: 1px solid rgba(34, 197, 94, 0.2);
        }

        .grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 2rem;
            margin-bottom: 2rem;
        }

        .full-width {
            grid-column: 1 / -1;
        }

        .card {
            background-color: var(--card-bg);
            border: 1px solid var(--border);
            border-radius: 1rem;
            overflow: hidden;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1), 0 2px 4px -1px rgba(0, 0, 0, 0.06);
            display: flex;
            flex-direction: column;
        }

        .card-header {
            padding: 1.25rem 1.5rem;
            border-bottom: 1px solid var(--border);
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: rgba(255, 255, 255, 0.02);
        }

        .card-title {
            font-size: 1.125rem;
            font-weight: 600;
        }

        .table-container {
            max-height: 350px;
            overflow-y: auto;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            text-align: left;
        }

        th {
            padding: 1rem 1.5rem;
            background-color: rgba(15, 23, 42, 0.8);
            font-size: 0.75rem;
            text-transform: uppercase;
            letter-spacing: 0.05em;
            color: var(--text-secondary);
            font-weight: 600;
            position: sticky;
            top: 0;
            z-index: 10;
        }

        td {
            padding: 1rem 1.5rem;
            border-bottom: 1px solid var(--border);
            font-size: 0.875rem;
        }

        tr:last-child td {
            border-bottom: none;
        }

        .mono {
            font-family: 'JetBrains Mono', monospace;
            font-size: 0.8rem;
        }

        .side-buy {
            color: var(--success);
            font-weight: 600;
        }

        .side-sell {
            color: var(--danger);
            font-weight: 600;
        }

        .btn-squareoff {
            background-color: rgba(239, 68, 68, 0.1);
            color: var(--danger);
            border: 1px solid rgba(239, 68, 68, 0.2);
            padding: 0.4rem 0.8rem;
            border-radius: 0.5rem;
            font-size: 0.75rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s;
        }

        .btn-squareoff:hover {
            background-color: var(--danger);
            color: white;
        }

        .btn-squareoff:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }

        .empty-state {
            text-align: center;
            color: var(--text-secondary);
            padding: 2.5rem;
            font-size: 0.875rem;
        }

        /* Custom Scrollbar */
        ::-webkit-scrollbar {
            width: 6px;
        }

        ::-webkit-scrollbar-track {
            background: var(--bg-color);
        }

        ::-webkit-scrollbar-thumb {
            background: var(--border);
            border-radius: 10px;
        }

        ::-webkit-scrollbar-thumb:hover {
            background: var(--text-secondary);
        }
    </style>
</head>

<body>
    <div class="container">
        <header>
            <h1>Trading Dashboard</h1>
            <div class="status-badge">● Live Connected</div>
        </header>

        <div class="grid">
            <!-- OPEN POSITIONS -->
            <div class="card">
                <div class="card-header">
                    <span class="card-title">Open Positions</span>
                </div>
                <div class="table-container">
                    <table>
                        <thead>
                            <tr>
                                <th>Symbol</th>
                                <th>Side</th>
                                <th>Entry</th>
                                <th>Time</th>
                                <th>Action</th>
                            </tr>
                        </thead>
                        <tbody id="open-positions-body"></tbody>
                    </table>
                </div>
            </div>

            <!-- CLOSED POSITIONS -->
            <div class="card">
                <div class="card-header">
                    <span class="card-title">Closed Positions</span>
                </div>
                <div class="table-container">
                    <table>
                        <thead>
                            <tr>
                                <th>Symbol</th>
                                <th>Side</th>
                                <th>Entry @ Time</th>
                                <th>Exit @ Time</th>
                            </tr>
                        </thead>
                        <tbody id="closed-positions-body"></tbody>
                    </table>
                </div>
            </div>

            <!-- ALERTS -->
            <div class="card">
                <div class="card-header">
                    <span class="card-title">TradingView Alerts</span>
                </div>
                <div class="table-container">
                    <table>
                        <thead>
                            <tr>
                                <th>Time</th>
                                <th>Symbol</th>
                                <th>Action</th>
                                <th>Price</th>
                            </tr>
                        </thead>
                        <tbody id="alerts-body"></tbody>
                    </table>
                </div>
            </div>

            <!-- ORDERS -->
            <div class="card">
                <div class="card-header">
                    <span class="card-title">Order History</span>
                </div>
                <div class="table-container">
                    <table>
                        <thead>
                            <tr>
                                <th>Time</th>
                                <th>Symbol</th>
                                <th>Action</th>
                                <th>Status</th>
                            </tr>
                        </thead>
                        <tbody id="orders-body"></tbody>
                    </table>
                </div>
            </div>
        </div>
    </div>

    <script>
        // Smart URL detection: If opened via Live Server (5500), point to Flask (5000)
        const API_BASE = window.location.port === '5000' || window.location.port === ''
            ? ''
            : 'http://127.0.0.1:5000';

        async function squareOff(symbol) {
            const btn = event.target;
            const originalText = btn.textContent;
            btn.disabled = true;
            btn.textContent = '...';

            try {
                const response = await fetch(`${API_BASE}/square_off`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ symbol: symbol })
                });

                const result = await response.json();
                if (!response.ok) {
                    alert('Square off failed: ' + (result.message || 'Unknown error'));
                }
                loadLogs();
            } catch (err) {
                alert('Error: ' + err.message);
            } finally {
                btn.disabled = false;
                btn.textContent = originalText;
            }
        }

        function formatTime(timeStr) {
            if (!timeStr) return '-';
            try {
                // Return full date and time (remove milliseconds if present)
                return timeStr.split('.')[0];
            } catch (e) {
                return timeStr;
            }
        }

        async function loadLogs() {
            try {
                const response = await fetch(`${API_BASE}/logs`);
                const data = await response.json();

                // Open Positions
                let openHtml = '';
                if (data.open_positions && data.open_positions.length > 0) {
                    data.open_positions.forEach(pos => {
                        const side = (pos.side || '').toUpperCase();
                        openHtml += `
                            <tr>
                                <td class="mono" style="font-weight:600">${pos.symbol}</td>
                                <td class="${side === 'BUY' ? 'side-buy' : 'side-sell'}">${side}</td>
                                <td class="mono">${pos.price}</td>
                                <td class="mono" style="font-size: 0.75rem">${formatTime(pos.open_time)}</td>
                                <td>
                                    <button class="btn-squareoff" onclick="squareOff('${pos.symbol}')">Square Off</button>
                                </td>
                            </tr>
                        `;
                    });
                } else {
                    openHtml = '<tr><td colspan="5" class="empty-state">No open positions</td></tr>';
                }
                document.getElementById('open-positions-body').innerHTML = openHtml;

                // Closed Positions
                let closedHtml = '';
                if (data.closed_positions && data.closed_positions.length > 0) {
                    data.closed_positions.forEach(pos => {
                        const side = (pos.side || '').toUpperCase();
                        closedHtml += `
                            <tr>
                                <td class="mono" style="font-weight:600">${pos.symbol}</td>
                                <td class="${side === 'BUY' ? 'side-buy' : 'side-sell'}">${side}</td>
                                <td class="mono">
                                    ${pos.price} <span style="color: var(--text-secondary); font-size: 0.7rem">@ ${formatTime(pos.open_time)}</span>
                                </td>
                                <td class="mono">
                                    ${pos.close_price} <span style="color: var(--text-secondary); font-size: 0.7rem">@ ${formatTime(pos.close_time)}</span>
                                </td>
                            </tr>
                        `;
                    });
                } else {
                    closedHtml = '<tr><td colspan="4" class="empty-state">No closed positions</td></tr>';
                }
                document.getElementById('closed-positions-body').innerHTML = closedHtml;

                // Alerts
                let alertsHtml = '';
                if (data.alerts && data.alerts.length > 0) {
                    data.alerts.forEach(alert => {
                        const action = (alert.action || '').toUpperCase();
                        alertsHtml += `
                            <tr>
                                <td class="mono" style="font-size: 0.75rem; color: var(--text-secondary)">${formatTime(alert.time)}</td>
                                <td class="mono">${alert.symbol}</td>
                                <td class="${action === 'BUY' ? 'side-buy' : 'side-sell'}">${action}</td>
                                <td class="mono">${alert.price}</td>
                            </tr>
                        `;
                    });
                } else {
                    alertsHtml = '<tr><td colspan="4" class="empty-state">No alerts yet</td></tr>';
                }
                document.getElementById('alerts-body').innerHTML = alertsHtml;

                // Orders
                let ordersHtml = '';
                if (data.orders.length > 0) {
                    data.orders.forEach(order => {
                        ordersHtml += `
                            <tr>
                                <td class="mono" style="font-size: 0.75rem; color: var(--text-secondary)">${formatTime(order.time)}</td>
                                <td class="mono">${order.symbol}</td>
                                <td>${order.action}</td>
                                <td><span style="color: ${order.status === 'Order placed successfully' ? 'var(--success)' : 'var(--danger)'}">${order.status}</span></td>
                            </tr>
                        `;
                    });
                } else {
                    ordersHtml = '<tr><td colspan="4" class="empty-state">No orders yet</td></tr>';
                }
                document.getElementById('orders-body').innerHTML = ordersHtml;

            } catch (err) {
                console.error("Failed to load logs:", err);
            }
        }

        setInterval(loadLogs, 2000);
        loadLogs();
    </script>
</body>

</html>
